<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
  <!-- Niebla: ruido fractal estirado en horizontal. stitchTiles permite repetirla sin costuras. -->
  <filter id="niebla" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.009" numOctaves="4" seed="11" stitchTiles="stitch" />
    <!-- Color crema (#EDF3EF) y opacidad tomada del ruido: solo las zonas densas se ven. -->
    <feColorMatrix type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.95  0 0 0 0 0.94  2.4 0 0 0 -1.05" />
  </filter>
  <rect width="100%" height="100%" filter="url(#niebla)" />
</svg>
